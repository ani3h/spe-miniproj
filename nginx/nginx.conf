# Reverse proxy in front of the calculator replicas.
# Docker's DNS resolves "calculator" to every replica; nginx round-robins across them.
upstream calculator_backend {
    server calculator:8080;
}

server {
    listen 80;

    location / {
        proxy_pass http://calculator_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
