services:
  calculator:
    # Jenkins sets DOCKER_IMAGE and IMAGE_TAG; locally `docker compose up --build` builds from the Dockerfile
    image: ${DOCKER_IMAGE:-calculator}:${IMAGE_TAG:-latest}
    build: .
    environment:
      - PORT=8080
      - JAVA_TOOL_OPTIONS=-Xmx256m
    # Two replicas behind Nginx; no host port, only reachable through the proxy
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - calc-net

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HOST_PORT:-8081}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      calculator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - calc-net

networks:
  calc-net:
    driver: bridge
